<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Controller grips — drawn first so body overlaps and merges with them -->
  <ellipse cx="17" cy="43" rx="9" ry="11" fill="white" opacity="0.93"/>
  <ellipse cx="47" cy="43" rx="9" ry="11" fill="white" opacity="0.93"/>

  <!-- Controller main body -->
  <rect x="9" y="17" width="46" height="30" rx="12" fill="white" opacity="0.93"/>

  <!-- D-pad vertical bar -->
  <rect x="19.5" y="21" width="5" height="18" rx="2.5" fill="#4F46E5"/>
  <!-- D-pad horizontal bar -->
  <rect x="15" y="25.5" width="14" height="9" rx="2.5" fill="#4F46E5"/>

  <!-- Face buttons — diamond layout -->
  <circle cx="43" cy="24" r="3.5" fill="#7C3AED"/>
  <circle cx="49" cy="30" r="3.5" fill="#4F46E5"/>
  <circle cx="43" cy="36" r="3.5" fill="#7C3AED"/>
  <circle cx="37" cy="30" r="3.5" fill="#4F46E5"/>

  <!-- Center / home button -->
  <circle cx="32" cy="22" r="2.8" fill="#6366F1" opacity="0.55"/>
  <circle cx="32" cy="22" r="1.5" fill="white" opacity="0.7"/>
</svg>
